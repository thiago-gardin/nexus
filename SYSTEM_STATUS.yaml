notes: "Nexus is ready for local-first operational use and maintenance under the approved PRD assumptions. Phase 20 PRD acceptance closure remains the baseline, and the 2026-04-13 post-closure completion sprint closed confirmed spec gaps for GovernanceService.override semantics, GovernanceRule API exposure, actor-filtered event reads, minimum object version comparison, and agent manifest/read-route reflection. On 2026-04-21 a minimum Day 0 operational control plane slice added domain versions, atomic source registration, object validation service, authoring API hardening, cockpit action panel, MCP local_operator profile, Day 0 Work/Mail templates, and materialization of charters/sources/runs/authoring summaries. On 2026-04-23 the cockpit moved to an `Operate Workspace` model with preserved context, inline receipts/errors, charter-aware authoring, explicit materialization control, and matching MCP/REST read contracts for operate context and active charter. On 2026-04-24 the human surface was consolidated into a unified workbench shared by `operate` and `graph`, replacing stacked action cards with an action drawer, label-based pickers, inferred schema-driven human forms, automatic ID suggestion in the cockpit flow, and coupled inspector/event/publication context. External connectors remain explicitly out of scope; PST parsing is not claimed. This status does not claim hosted, connector-complete, or general-availability product readiness."
